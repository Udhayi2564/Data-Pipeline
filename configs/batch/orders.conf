env {
    job.name = "orders-migration-batch"
    job.mode = "BATCH"
    parallelism = 2
}

source {
    Jdbc {
        plugin_name = "Jdbc"
        url = "jdbc:oracle:thin:@//mds-oracle:1521/FREEPDB1"
        driver = "oracle.jdbc.OracleDriver"
        username = "${ORACLE_USER:hr}"
        password = "${ORACLE_PASSWORD:HrOracle123}"
        query = "SELECT ORDER_ID, CUSTOMER_NAME, PRODUCT_NAME, CATEGORY, QUANTITY, UNIT_PRICE, ORDER_STATUS, UPDATED_AT FROM HR.SEATUNNEL_ORDERS ORDER BY ORDER_ID"
        connection.pool.maxSize = 5
        connection.pool.minSize = 1
        connection.pool.acquireTimeout = 30000
        fetch_size = 1000
    }
}

transform {
}

sink {
    Jdbc {
        plugin_name = "Jdbc"
        url = "jdbc:postgresql://mds-postgres:5432/etl_target"
        driver = "org.postgresql.Driver"
        username = "${POSTGRES_USER:postgres}"
        password = "${POSTGRES_PASSWORD:Postgres123}"
        database = "etl_target"
        schema = "serving"
        table = "orders"
        generate_sink_sql = true
        schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
        table_save_mode = "CREATE_TABLE_WHEN_NOT_EXIST"
        primary_keys = ["ORDER_ID"]
        unique_mode = "FIRST"
        batch_size = 1000
        flush_interval = 10000
        jdbc_url_params = "?reWriteBatchedInserts=true&useServerPrepStmts=false"
    }
}