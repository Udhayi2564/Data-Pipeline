# SeaTunnel Streaming Configuration for Oracle CDC to PostgreSQL Migration
# Uses Oracle LogMiner via Debezium Embedded
# Generated by Transpiler - Execute as-is

env {
    job.name = "orders-cdc-streaming"
    job.mode = "STREAMING"
    job.description = "CDC migration from Oracle to PostgreSQL using LogMiner"

    # Checkpoint configuration for recovery
    checkpointing.interval = 30000
    checkpointing.flush.interval = 10000
    checkpoint.timeout = 60000
    minimum.idle.readiness.timer = 10000

    # Restart strategy
    restart.recovery = true
    execution.checkpointing.interval = 30000

    # Parallelism for streaming
    parallelism = 2

    # Metrics
    metrics.reporter = "jmx"
}

source {
    OracleCdc {
        plugin_output = "cdc_changes"

        # Oracle connection - CDB/PDB aware
        hostname = "host.docker.internal"
        port = 1521
        dbname = "FREEPDB1"  # PDB service name
        username = "${ORACLE_CDC_USER:C##DBZUSER}"
        password = "${ORACLE_CDC_PASSWORD:dbz}"

        # PDB-specific configuration
        pdb.name = "FREEPDB1"
        pdb.service.name = "FREEPDB1"

        # LogMiner configuration
        database.hostname = "host.docker.internal"
        database.port = 1521
        database.user = "${ORACLE_CDC_USER:C##DBZUSER}"
        database.password = "${ORACLE_CDC_PASSWORD:dbz}"
        database.dbname = "FREEPDB1"
        database.pdb.name = "FREEPDB1"
        database.connection.adapter = "logminer"

        # Debezium Embedded engine settings (internally managed by SeaTunnel)
        database.query.timeout.ms = 60000
        database.acquire.timeout.ms = 30000
        database.connection.pool.size = 10

        # SCN-based startup after snapshot
        startup.scn = ""  # Empty means start from latest after snapshot
        startup.mode = "initial"  # initial, snapshot, late_incremental

        # Redo log configuration
        log.mining.strategy = "online_log"
        log.mining.history.window = 120000
        log.mining.always.filter.valid.data = true

        # Snapshot settings
        snapshot.mode = "initial"
        snapshot.isolation.mode = "repeatable_read"
        snapshot.fetch.size = 1000
        snapshot.max.threads = 3

        # Table selection
        # Format: schema.table or just table_name for current PDB
        table.include.list = ["HR.SEATUNNEL_ORDERS"]
        table.exclude.list = []

        # Column selection - all columns from source
        column.include.list = ["HR.SEATUNNEL_ORDERS.*"]

        # Primary key configuration for upsert
        primary.key.mode = "none"  # Will be derived from CDC metadata

        # Message key
        message.key.columns = "ORDER_ID"

        # Incremental snapshot threshold
        incremental.snapshot.threshold.label = "ORDER_ID"
        incremental.snapshot.chunk.size = 1000

        # Heartbeat for connection health
        heartbeat.interval = 60000

        # Scan and transform settings
        scan.start.mode = "initial"
        scan.start.scn = 0

        # Performance tuning
        fetch.size = 1000
        max.batch.size = 500
        max.queue.size = 2048
    }
}

transform {
    # Key value transformation for CDC metadata
    # Converts Debezium structure to flat row format
    cdc {
        tombstone.on.delete = true
        include.tombstone = false
        include.source = true
        source.include = ["ORDER_ID", "CUSTOMER_NAME", "PRODUCT_NAME", "CATEGORY", "QUANTITY", "UNIT_PRICE", "ORDER_STATUS", "UPDATED_AT"]
    }
}

sink {
    Jdbc {
        plugin_input = "cdc_changes"

        # Connection
        url = "jdbc:postgresql://host.docker.internal:5433/etl_target"
        driver = "org.postgresql.Driver"

        username = "${POSTGRES_USER:postgres}"
        password = "${POSTGRES_PASSWORD:Postgres123}"

        # Target
        database = "etl_target"
        schema = "harmonized"
        table = "orders_cdc"

        # Schema management
        generate_sink_sql = true
        schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
        table_save_mode = "CREATE_TABLE_WHEN_NOT_EXIST"

        # Upsert configuration for CDC
        primary_keys = ["ORDER_ID"]
        unique_mode = "REPLACE"  # REPLACE for CDC - latest value wins

        # Transaction support
        support.auto.commit = false
        transaction.write.mode = "group"

        # Batch settings for CDC
        batch_size = 100
        flush_interval = 5000

        # CDC-specific sink mode
        sink.mode = "upsert"
        sink.with.upsert = true

        # Data type mapping
        jdbc_url_params = "?reWriteBatchedInserts=true&useServerPrepStmts=false"

        # Deletion tracking
        sink.delete.mode = "hard_delete"
    }
}